name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: yohn-jp/.github/.github/workflows/npm-publish.yml@4fb520dcfc63f386a2e33d6c0a74f251f8dc9bdb
    with:
      working-directory: .
      node-version: "22"
      smoke-test-node-versions: "22,24"
      npm-cli-version: "11.5.1"
