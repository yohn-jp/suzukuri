name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: yohn-jp/.github/.github/workflows/codeql.yml@9962f9262e333e4d3b14c5d5fe13a0b012c2d0bb
    with:
      languages: "javascript-typescript,actions"
      config-file: ".github/codeql/codeql-config.yml"
