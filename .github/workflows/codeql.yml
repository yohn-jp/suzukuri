name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: yohn-jp/.github/.github/workflows/codeql.yml@4fb520dcfc63f386a2e33d6c0a74f251f8dc9bdb
    with:
      languages: "javascript-typescript,actions"
      config-file: ".github/codeql/codeql-config.yml"
